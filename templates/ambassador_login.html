<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ambassador Login – Nearva</title>
    <meta name="description" content="Community Ambassador login portal for Nearva platform.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        
    :root {
        --bg-base:      #0a0a0f;
        --bg-surface:   #12121a;
        --bg-card:      #16161f;
        --bg-elevated:  #1e1e2d;
        --border:       rgba(255,255,255,0.08);
        --border-glow:  rgba(99,102,241,0.3);
        --text-primary: #f0f2ff;
        --text-muted:   #7b82a0;
        --indigo:       #6366f1;
        --cyan:         #22d3ee;
        --accent:       #6366f1;
    }

        html, body { 
            height: 100%; 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg-base); 
            color: var(--text-primary); 
        }

        /* ── Animated gradient BG ── */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 60% 40% at 80% 0%, rgba(99,102,241,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 50% 35% at 10% 100%, rgba(34,211,238,0.08) 0%, transparent 70%);
        }

        /* ── Floating blobs ── */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }
        .blob-1 { width:300px; height:300px; background:rgba(99,102,241,0.4); top:-50px; right:-50px; animation: float1 8s ease-in-out infinite; }
        .blob-2 { width:250px; height:250px; background:rgba(34,211,238,0.3); bottom:-50px; left:-50px; animation: float2 10s ease-in-out infinite; }
        
        @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,20px)} }
        @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-15px)} }
        @keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

        /* ── Card ── */
        .glass-card {
            position: relative; z-index: 1;
            background: rgba(22,22,31,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.02);
        }

        /* ── Logo icon ── */
        .logo-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 32px -4px rgba(99,102,241,0.5), inset 0 2px 10px rgba(255,255,255,0.1);
        }
        .logo-icon svg { width:36px; height:36px; color:#c7d2fe; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        h1 { font-size: 1.75rem; font-weight:900; text-align:center; letter-spacing:-0.5px; margin-bottom:8px; 
             background: linear-gradient(to right, #fff, #c7d2fe); -webkit-background-clip: text; color: transparent; }
        .subtitle { text-align:center; color:var(--text-muted); font-size:0.875rem; font-weight:600; margin-bottom:12px; }
        
        .motive-tag {
            display: inline-flex; justify-content: center; width: 100%;
            align-items: center; gap: 6px; margin-bottom: 32px;
            color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
        }

        /* ── Form ── */
        .form-group { margin-bottom: 20px; }
        label { display:block; font-size:0.75rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px; }
        input {
            width:100%;
            background: var(--bg-elevated);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            font-size: 0.9375rem;
            font-weight: 700;
            color: white;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(99,102,241,0.2), inset 0 2px 6px rgba(0,0,0,0.3);
            background: var(--bg-card);
        }
        input::placeholder { color: #4b5563; font-weight:500; }

        /* ── Submit button ── */
        .btn-login {
            width:100%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color:white; border:none; border-radius: 16px;
            padding: 18px; font-size: 0.9375rem; font-weight:800;
            cursor:pointer;
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
            box-shadow: 0 8px 24px -4px rgba(99,102,241,0.4), inset 0 2px 4px rgba(255,255,255,0.2);
            margin-top: 12px;
            display:flex; align-items:center; justify-content:center; gap:8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn-login:hover  { transform:translateY(-2px); box-shadow:0 12px 32px -6px rgba(99,102,241,0.6), inset 0 2px 4px rgba(255,255,255,0.2); }
        .btn-login:active { transform:scale(0.96); }
        .btn-login:disabled { opacity:0.6; pointer-events:none; }

        /* ── Error ── */
        .error-box {
            background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.3); border-radius:14px;
            padding:14px 16px; color:#f87171; font-size:0.8125rem; font-weight:600;
            margin-bottom:24px; display:flex; align-items:flex-start; gap:10px;
        }

        /* ── Info note ── */
        .info-note {
            background:#161b2e; border: 1px solid rgba(59,130,246,0.2); border-radius:16px; padding:16px;
            display:flex; align-items:flex-start; gap:12px; margin-top:28px;
        }
        .info-note p { font-size:0.8125rem; color:#93c5fd; font-weight:500; line-height:1.5; }

        /* ── Back link ── */
        .back-link {
            display:flex; align-items:center; justify-content:center; gap: 6px; margin-top:32px;
            font-size:0.8125rem; font-weight:700; color:var(--text-muted);
            text-decoration:none; transition:color 0.2s;
        }
        .back-link:hover { color:var(--text-primary); }

        /* ── Spinner ── */
        .spinner {
            width:20px; height:20px;
            border:3px solid rgba(255,255,255,0.3);
            border-top-color:white;
            border-radius:50%;
            animation:spin 0.7s linear infinite;
        }
        @keyframes spin { to{transform:rotate(360deg)} }

        @media(max-width:480px) {
            .glass-card { padding:36px 24px; border-radius:28px; }
            h1 { font-size:1.5rem; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="glass-card">
        <!-- Logo -->
        <div class="logo-icon">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/>
            </svg>
        </div>

        <h1>Ambassador HQ</h1>
        <div class="motive-tag">
            Lead • Grow • Empower
        </div>

        <!-- Error message from server -->
        {% if error %}
        <div class="error-box">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0; margin-top:1px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/ambassador/login" id="loginForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="phone">Registered Phone Node</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter assigned 10-digit ID"
                    required autocomplete="tel" maxlength="10" inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="password">Security Key</label>
                <input type="password" id="password" name="password" placeholder="••••••••"
                    required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Access Dashboard</span>
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
            </button>
        </form>

        <!-- Info note -->
        <div class="info-note">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:#60a5fa; flex-shrink:0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            <p>Access is strictly restricted to assigned Nearva Community Leaders. You cannot self-register.</p>
        </div>

        <a href="/" class="back-link">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Return to Reality
        </a>
    </div>

    <script>
        function handleSubmit(e) {
            const btn = document.getElementById('loginBtn');
            const text = document.getElementById('btnText');
            // Validate phone
            const phone = document.getElementById('phone').value.replace(/\s/g, '');
            if (!/^\d{10}$/.test(phone)) {
                e.preventDefault();
                return;
            }
            btn.disabled = true;
            btn.innerHTML = `<div class="spinner"></div><span>Authenticating...</span>`;
        }
    </script>
</body>
</html>
