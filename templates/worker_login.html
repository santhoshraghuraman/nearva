{% set dark_nav = False %}
{% extends 'base.html' %}

{% block title %}Worker Login - Nearva{% endblock %}

{% block head %}
<style>
    :root {
        --bg-base: #0a0a0f;
        --bg-card: #111119;
        --bg-input: #1f2937;
        --bg-elevated: #2d3748;
        --border: #374151;
        --accent: #3b82f6;
        --text-primary: #ffffff;
        --text-muted: #9ca3af;
        --text-dim: #6b7280;
    }

    .glass-panel {
        background: rgba(22, 22, 31, 0.7);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
    }

    .input-focus {
        background: var(--bg-input) !important;
        border: 1px solid var(--border) !important;
        color: var(--text-primary) !important;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-focus:focus {
        border-color: var(--accent) !important;
        background: var(--bg-card) !important;
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.15), 0 0 0 2px rgba(59, 130, 246, 0.1) !important;
        outline: none !important;
    }

    .input-focus::placeholder {
        color: var(--text-muted) !important;
        opacity: 0.8;
    }

    .premium-btn {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .premium-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.5);
    }

    .premium-btn:active {
        transform: translateY(0) scale(0.98);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animate-fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .login-gradient {
        background: radial-gradient(circle at top right, #1e1b4b 0%, #0a0a0f 60%);
    }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 pt-32 pb-20 login-gradient">
    <div class="max-w-md w-full glass-panel rounded-[2.5rem] p-10 animate-fade-in relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-600"></div>
        <div class="text-center mb-10">
            <h2 class="text-4xl font-black text-white tracking-tighter" data-en="Nearva" data-ta="பணியாளர்">Nearva
            </h2>
            <p class="mt-4 font-bold text-xs uppercase tracking-[0.2em] text-[#9ca3af]/80"
                data-en="Worker Management Portal" data-ta="பணியாளர் மேலாண்மை">Worker Management Portal</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div class="space-y-4">
                <div class="relative group">
                    <label for="phone"
                        class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1 mb-1.5 block"
                        data-en="Phone Number" data-ta="தொலைபேசி எண்">Phone Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                            </svg>
                        </span>
                        <input id="phone" name="phone" type="tel" required inputmode="numeric" pattern="[0-9]*"
                            class="input-focus block w-full pl-12 pr-4 py-4 rounded-2xl font-bold transition-all font-inter"
                            placeholder="Enter mobile number" data-en="Enter mobile number"
                            data-ta="தொலைபேசி எண்ணை உள்ளிடவும்">
                    </div>
                </div>

                <div class="relative group">
                    <label for="password"
                        class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1 mb-1.5 block"
                        data-en="Password" data-ta="கடவுச்சொல்">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input id="password" name="password" type="password" required
                            class="input-focus block w-full pl-12 pr-4 py-4 rounded-2xl font-bold transition-all font-inter"
                            placeholder="••••••••">
                    </div>
                </div>
            </div>

            <button type="submit"
                class="premium-btn w-full text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span id="btn-text" data-en="Log In" data-ta="உள்நுழைய">Log In</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                        clip-rule="evenodd" />
                </svg>
            </button>

            <div class="text-center pt-2">
                <p class="text-sm text-var(--text-muted) font-bold" style="color:var(--text-muted)">
                    <span data-en="New to Nearva?" data-ta="நியார்வாவிற்கு புதியவரா?">New to Nearva?</span>
                    <a href="/register" class="text-indigo-400 font-black hover:text-white transition-colors ml-1"
                        data-en="Join as Partner" data-ta="கூட்டாளராகுங்கள்">
                        Join as Partner
                    </a>
                </p>
            </div>

            <p id="error-msg"
                class="text-red-400 text-center text-xs font-black bg-red-500/10 py-3 border border-red-500/20 rounded-xl hidden">
            </p>
        </form>

        <div class="mt-10 pt-8 border-t border-white/5 flex justify-between items-center px-2">
            <a href="/"
                class="text-[10px] font-black text-var(--text-muted) uppercase tracking-widest hover:text-white transition-colors"
                style="color:var(--text-muted)" data-en="← Back Home" data-ta="← முகப்பு">← Back Home</a>
            <span class="text-[10px] font-black text-var(--text-dim) uppercase tracking-widest"
                style="color:var(--text-dim)">V 2.5.0</span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', handleLogin);

    async function handleLogin(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value;
        const btn = e.target.querySelector('button');
        const btnText = document.getElementById('btn-text');
        const errorMsg = document.getElementById('error-msg');

        btn.disabled = true;
        btnText.textContent = "Verifying...";
        errorMsg.classList.add('hidden');

        const formData = new FormData();
        formData.append('phone', phone);
        formData.append('password', document.getElementById('password').value);

        try {
            const response = await fetch('/api/worker/login', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (data.status === 'success') {
                localStorage.setItem('nearva_worker_id', data.worker.id);
                localStorage.setItem('nearva_worker_name', data.worker.name);
                localStorage.setItem('nearva_worker_status', data.worker.status);
                window.location.href = '/worker/dashboard';
            } else {
                errorMsg.textContent = data.message || "Invalid credentials";
                errorMsg.classList.remove('hidden');
            }
        } catch (err) {
            console.error(err);
            errorMsg.textContent = "Network error. Try again.";
            errorMsg.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btnText.textContent = "Log In";
        }
    }
</script>
{% endblock %}
